<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Загрузка файла</title>
<style>
* { box-sizing: border-box; }

html, body {
height: 100%;
margin: 0;
}

body {
background: #000;
color: #fff;
font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
display: flex;
align-items: center;
justify-content: center;
}

.wrap {
text-align: center;
width: 100%;
max-width: 520px;
padding: 24px;
}

h1 {
font-size: 28px;
font-weight: 600;
margin: 0 0 24px;
}

form {
display: flex;
align-items: center;
gap: 12px;
justify-content: center;
flex-wrap: wrap;
}

/* Кнопка слева */
button {
background: #fff;
color: #000;
border: none;
padding: 10px 18px;
border-radius: 8px;
font-size: 15px;
font-weight: 600;
cursor: pointer;
transition: opacity .15s;
}
button:hover { opacity: .85; }

/* Поле выбора файла справа */
input[type="file"] {
color: #ddd;
font-size: 14px;
}
input[type="file"]::file-selector-button {
background: #1a1a1a;
color: #fff;
border: 1px solid #333;
padding: 8px 14px;
border-radius: 8px;
margin-right: 10px;
cursor: pointer;
font-size: 14px;
}
input[type="file"]::file-selector-button:hover {
background: #262626;
}

.flash {
margin-top: 20px;
font-size: 14px;
color: #9ae6b4;
}
.flash.error { color: #fc8181; }
</style>
</head>
<body>
<div class="wrap">
<h1>Загрузите файл</h1>

<form method="post" enctype="multipart/form-data">
<button type="submit">Отправить</button>
<input type="file" name="file" accept="application/pdf,.pdf" required>
</form>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, msg in messages %}
<div class="flash {{ 'error' if category == 'error' else '' }}">{{ msg }}</div>
{% endfor %}
{% endif %}
{% endwith %}
</div>
</body>
</html>
